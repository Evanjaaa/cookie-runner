# ─────────────────────────────────────────────────────────────
# ใช้ยังไง
#   docker compose up            เปิดเซิร์ฟเวอร์ตอนพัฒนา → http://localhost:5173
#   docker compose up --build    ใช้ตอนแก้ package.json หรือ Dockerfile
#   docker compose down          ปิด
#
# มือถือเข้าได้ด้วย: หา IP ของเครื่องในวง Wi-Fi แล้วเปิด http://<IP>:5173
# ─────────────────────────────────────────────────────────────
services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      # โค้ดจริงจากเครื่องเรา แก้แล้วเห็นผลทันทีไม่ต้อง build ใหม่
      - .:/app

      # ทับ node_modules ของเครื่องด้วยของในคอนเทนเนอร์ — บรรทัดนี้ห้ามลบ
      #
      # เครื่องเราเป็น Windows แต่คอนเทนเนอร์เป็น Linux ส่วน esbuild ที่ Vite ใช้
      # เป็นไฟล์ไบนารีคนละตัวกันของแต่ละระบบ ถ้าปล่อยให้ bind mount ทับเข้าไป
      # คอนเทนเนอร์จะไปเจอไบนารีของ Windows แล้วรันไม่ได้ทันที
      #
      # volume แบบไม่มีชื่อตรงนี้ทำหน้าที่ "กัน" เฉพาะโฟลเดอร์นี้ไว้
      # ให้ใช้ของที่ npm ci ลงไว้ตอน build image แทน
      - /app/node_modules

    # ไม่ต้องมี env_file ตรงนี้ — ตอน dev ตัว Vite อ่าน .env จากโฟลเดอร์โปรเจกต์เอง
    # ซึ่ง mount เข้ามาพร้อมโค้ดในบรรทัดข้างบนอยู่แล้ว
    #
    # (.dockerignore กัน .env ไว้ก็จริง แต่มันมีผลเฉพาะตอน build image
    #  ไม่เกี่ยวกับ bind mount ตอนรัน ไฟล์จึงยังอยู่ให้ Vite อ่านได้ปกติ)
    # ไม่มี .env ก็ยังเล่นได้ แค่ไม่มีระบบคลาวด์ — ดู cloudReady ใน net/cloud.js

    # ปิดแล้วเปิดใหม่ให้เองถ้าคอนเทนเนอร์ตาย แต่ไม่ยุ่งถ้าเราสั่งปิดเอง
    restart: unless-stopped

    # ให้กด Ctrl+C ปิดได้ทันที ไม่ต้องรอ timeout
    stdin_open: true
    tty: true
