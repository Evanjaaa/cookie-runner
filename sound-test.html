<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทดสอบเสียง — MeowZing</title>
<!--
  หน้าทดสอบเสียงแยกจากตัวเกม ใช้ตอบคำถามเดียว: "เสียงหายไปที่ชั้นไหน"

  เกมส่งเสียงออกได้หลายทาง และ iOS ปฏิบัติกับแต่ละทางไม่เหมือนกัน
  หน้านี้จึงยิงทีละทางแยกกัน แล้วให้คนฟังบอกว่าได้ยินอันไหนบ้าง
  ผลที่ได้ชี้สาเหตุตรง ๆ โดยไม่ต้องเดา:

    ได้ยินแค่ปุ่ม 2          = Web Audio โดนสวิตช์ปิดเสียงข้างเครื่องกลืน
    ไม่ได้ยินสักปุ่ม          = อยู่ที่ระดับเครื่อง (สวิตช์/ระดับเสียง/บลูทูธ)
    ได้ยิน 1-3 แต่ 4-5 เงียบ  = เครื่องปกติ ทางเดินเสียงของเกมเองพัง
    ได้ยินหมดทุกปุ่ม         = ระบบเสียงปกติทั้งสาย ต้องไปหาที่หน้าเกม

  เข็มวัดข้างล่างอ่านจากสัญญาณจริงก่อนออกลำโพง ถ้าเข็มขยับแต่ไม่ได้ยิน
  แปลว่าหน้าเว็บส่งเสียงออกแล้วจริง ๆ แต่ตัวเครื่องกลืนไว้
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 18px 16px 40px;
    background: linear-gradient(180deg, #3A1D50, #1B0F2B);
    color: #FFF3E2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; color: #C9AEE8; font-size: 14px; }
  button {
    display: block;
    width: 100%;
    margin: 0 0 10px;
    padding: 16px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,243,226,.28);
    background: linear-gradient(180deg, #7C40A9, #45206E);
    color: #FFF3E2;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }
  button:active { transform: translateY(2px); }
  button b { display: block; font-size: 12px; font-weight: 400; color: #D9C6EE; margin-top: 3px; }
  .meter {
    height: 16px;
    margin: 6px 0 16px;
    border-radius: 999px;
    background: rgba(12,4,24,.6);
    border: 1px solid rgba(255,243,226,.2);
    overflow: hidden;
  }
  .meter i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #6FD98F, #FFC93C);
    transition: width .08s linear;
  }
  pre {
    margin: 0;
    padding: 12px;
    border-radius: 12px;
    background: rgba(12,4,24,.55);
    border: 1px solid rgba(255,243,226,.16);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .hint { font-size: 13px; color: #C9AEE8; margin: 14px 0 6px; }
</style>
</head>
<body>

<h1>ทดสอบเสียง</h1>
<p class="lead">กดทีละปุ่มจากบนลงล่าง แล้วจำไว้ว่า “ได้ยินปุ่มไหนบ้าง”</p>

<button id="b1">1 · เสียงสังเคราะห์ (Web Audio)
  <b>เสียงเอฟเฟกต์ในเกมทั้งหมดใช้ทางนี้</b></button>

<button id="b2">2 · ไฟล์เสียงตรง ๆ (ไม่ผ่าน Web Audio)
  <b>ทางที่ iOS ถือว่าเป็น “สื่อ” — ไม่โดนสวิตช์ปิดเสียง</b></button>

<button id="b3">3 · ไฟล์เสียงผ่าน Web Audio
  <b>เพลงในเกมใช้ทางนี้</b></button>

<button id="b4">4 · ระบบเสียงของเกมจริง (audio.js)
  <b>เรียกทางเดียวกับที่เกมใช้ยิงเสียงเอฟเฟกต์</b></button>

<button id="b5">5 · เพลงหน้าแรกของเกมจริง (music.js)
  <b>เรียกทางเดียวกับที่เกมใช้เปิดเพลง</b></button>

<div class="hint">ระดับสัญญาณที่ส่งออกจริง (ขยับ = หน้าเว็บส่งเสียงออกแล้ว)</div>
<div class="meter"><i id="meter"></i></div>

<div class="hint">ข้อมูลเครื่อง — ถ่ายรูปส่วนนี้ส่งมาได้เลย</div>
<pre id="log">แตะปุ่มใดปุ่มหนึ่งก่อน</pre>

<script>
const logEl = document.getElementById('log');
const meterEl = document.getElementById('meter');
let ctx = null;
let analyser = null;
let silentEl = null;
const notes = [];

function makeCtx() {
  if (ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.connect(ctx.destination);
  tick();
  return ctx;
}

// ขอโหมด "สื่อ" แบบเดียวกับที่เกมขอ — iOS 17+ มี API นี้
function askPlayback() {
  try {
    if (navigator.audioSession) {
      navigator.audioSession.type = 'playback';
      return 'ขอแล้ว → ' + navigator.audioSession.type;
    }
    return 'เครื่องนี้ไม่มี audioSession API';
  } catch (e) {
    return 'ขอไม่สำเร็จ: ' + e.name;
  }
}

function tick() {
  const buf = new Float32Array(analyser.fftSize);
  const loop = () => {
    analyser.getFloatTimeDomainData(buf);
    let s = 0;
    for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    const rms = Math.sqrt(s / buf.length);
    meterEl.style.width = Math.min(100, rms * 600) + '%';
    requestAnimationFrame(loop);
  };
  loop();
}

function beep(seconds = 1.2) {
  const c = makeCtx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 660;
  gain.gain.value = 0.35;
  osc.connect(gain);
  gain.connect(analyser);
  osc.start();
  osc.stop(c.currentTime + seconds);
}

function report(what) {
  notes.unshift(what);
  const a = navigator.audioSession;
  logEl.textContent = [
    'ล่าสุด: ' + notes.slice(0, 4).join(' | '),
    '',
    'AudioContext: ' + (ctx ? ctx.state : 'ยังไม่สร้าง') + (ctx ? ' @' + ctx.sampleRate + 'Hz' : ''),
    'audioSession: ' + (a ? (a.type || '?') : 'ไม่มี API'),
    'ไฟล์เสียงล่าสุด: ' + (lastMedia || '—'),
    '',
    navigator.userAgent,
  ].join('\n');
}

let lastMedia = '';
function playFile(throughWebAudio) {
  const el = new Audio('/Hungry.mp3');
  el.crossOrigin = 'anonymous';
  el.volume = 1;
  if (throughWebAudio) {
    const c = makeCtx();
    try {
      const src = c.createMediaElementSource(el);
      src.connect(analyser);
    } catch (e) {
      lastMedia = 'ต่อเข้า Web Audio ไม่ได้: ' + e.name;
    }
  }
  el.play().then(
    () => { lastMedia = (throughWebAudio ? 'ผ่าน Web Audio' : 'ตรง ๆ') + ' → เล่นแล้ว'; report(throughWebAudio ? 'ปุ่ม 3' : 'ปุ่ม 2'); },
    (e) => { lastMedia = 'เล่นไม่ได้: ' + e.name; report(throughWebAudio ? 'ปุ่ม 3 (พัง)' : 'ปุ่ม 2 (พัง)'); },
  );
}

document.getElementById('b1').addEventListener('click', () => {
  const s = askPlayback();
  makeCtx().resume();
  beep();
  report('ปุ่ม 1 · ' + s);
});

document.getElementById('b2').addEventListener('click', () => playFile(false));
document.getElementById('b3').addEventListener('click', () => playFile(true));

// ── ยิงผ่าน "ระบบเสียงของเกมจริง" ──
// ปุ่ม 1-3 พิสูจน์ว่าเครื่องเล่นเสียงได้ ปุ่ม 4-5 จึงเหลือคำถามเดียว:
// ทางเดินเสียงของเกมเองพังตรงไหน — ดึงโมดูลจริงมาเรียกตรง ๆ แล้วอ่านค่าทุกปม
async function gameAudio() {
  const A = await import('/src/audio.js');
  const before = A.audioState();
  await A.unlockAudio();
  A.sfx.fish();
  setTimeout(() => A.sfx.win && A.sfx.win(), 250);
  const after = A.audioState();
  lastMedia = 'ก่อนปลุก ' + before.state + ' → หลังปลุก ' + after.state
    + ' · เพลง ' + Math.round(A.getMix('music') * 100) + '%'
    + ' · เอฟเฟกต์ ' + Math.round(A.getMix('sfx') * 100) + '%'
    + ' · โหมด ' + (after.session || 'ไม่มี API');
  report('ปุ่ม 4');
}

async function gameMusic() {
  const A = await import('/src/audio.js');
  await A.unlockAudio();
  const M = await import('/src/music.js');
  M.startMusic();
  setTimeout(() => {
    const st = A.audioState();
    lastMedia = 'เพลง: สั่งเล่นแล้ว · ระบบ ' + st.state
      + ' · ระดับเพลง ' + Math.round(A.getMix('music') * 100) + '%';
    report('ปุ่ม 5');
  }, 900);
}

document.getElementById('b4').addEventListener('click', () => {
  gameAudio().catch((e) => { lastMedia = 'พัง: ' + e.message; report('ปุ่ม 4 (พัง)'); });
});
document.getElementById('b5').addEventListener('click', () => {
  gameMusic().catch((e) => { lastMedia = 'พัง: ' + e.message; report('ปุ่ม 5 (พัง)'); });
});
</script>
</body>
</html>
