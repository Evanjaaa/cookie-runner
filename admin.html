<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowZing — หลังบ้าน</title>

  <!-- หน้านี้ไม่ควรโผล่ในผลค้นหา ไม่ได้กันคนเข้า (กันด้วย RLS ที่ฐานข้อมูล)
       แค่ไม่มีเหตุผลให้มันไปอยู่ใน Google -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Mitr = ฟอนต์หัวข้อของตัวเกม ให้รู้ว่าเป็นระบบเดียวกัน / Plex = ตัวหนังสือทั่วไป อ่านตัวเลขในตารางง่าย -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mitr:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ── หน้าเข้าสู่ระบบ ──────────────────────────────
       ใช้รหัส 6 หลักทางอีเมลเหมือนตัวเกม ไม่ใช่รหัสผ่าน
       จะได้ไม่ต้องมีรหัสผ่านอีกชุดให้ดูแลและให้หลุด -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M10 38V16l7 6h14l7-6v22a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4Z"/><circle cx="19" cy="30" r="2.2"/><circle cx="29" cy="30" r="2.2"/><path d="M22 35.5q2 1.6 4 0" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <h1>MeowZing <span>หลังบ้าน</span></h1>

      <div id="gateStep1">
        <p class="lead">เข้าด้วยอีเมลของแอดมิน ระบบจะส่งรหัส 6 หลักไปให้</p>
        <div class="field">
          <input id="email" type="email" inputmode="email" autocomplete="email"
                 placeholder="you@example.com">
          <button class="btn" id="sendCode">ส่งรหัส</button>
        </div>
      </div>

      <div id="gateStep2" class="hidden">
        <p class="lead">กรอกรหัส 6 หลักที่ส่งไปที่ <b id="sentTo"></b></p>
        <div class="field">
          <input id="code" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="6" placeholder="123456">
          <button class="btn" id="verifyCode">ยืนยัน</button>
        </div>
        <button class="linkbtn" id="backToEmail">ใช้อีเมลอื่น</button>
      </div>

      <p class="msg" id="gateMsg"></p>
    </div>
  </div>

  <!-- ── ตัวแอป ─────────────────────────────────────── -->
  <div class="app hidden" id="app">
    <!-- แถบข้าง: เมนูหลัก (บนมือถือกลายเป็นแถบเลื่อนแนวนอนใต้หัว) -->
    <aside class="side">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M10 38V16l7 6h14l7-6v22a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4Z"/><circle cx="19" cy="30" r="2.2"/><circle cx="29" cy="30" r="2.2"/></svg>
        </span>
        <span class="brand-text">MeowZing <small>หลังบ้าน</small></span>
      </div>

      <nav class="tabs" id="tabs" aria-label="เมนู">
        <button class="tab on" data-page="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5" rx="2"/><rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/></svg>
          <span>ภาพรวม</span>
        </button>
        <button class="tab" data-page="players">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6 0 4.5 1.6 5 4.4"/></svg>
          <span>ผู้เล่น</span>
        </button>
        <button class="tab" data-page="mail">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg>
          <span>จดหมาย</span>
        </button>
        <button class="tab" data-page="scores">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5A3.5 3.5 0 0 1 16.5 11"/></svg>
          <span>คะแนน</span>
        </button>
        <button class="tab" data-page="pulls">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><circle cx="12" cy="12" r="2.6"/></svg>
          <span>กาช่า</span>
        </button>
        <button class="tab" data-page="audit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 19.5h18L12 3Z"/><path d="M12 10v4.5M12 17.2v.3"/></svg>
          <span>ตรวจผิดปกติ</span>
        </button>
      </nav>

      <div class="who">
        <span class="who-dot" aria-hidden="true"></span>
        <span id="whoEmail" class="who-mail"></span>
        <button class="linkbtn" id="signOut">ออกจากระบบ</button>
      </div>
    </aside>

    <div class="main">
      <!-- ค้นผู้เล่นได้จากทุกหน้า — วางไอดีผู้ใช้ 8 ตัวแล้วกด Enter = เปิดคนนั้นทันที -->
      <header class="bar">
        <label class="gsearch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="gq" type="search" placeholder="ค้นผู้เล่น: ไอดี 8 ตัว ชื่อ หรืออีเมล" autocomplete="off" spellcheck="false" aria-label="ค้นผู้เล่น">
          <kbd>/</kbd>
        </label>
      </header>

      <main class="page" id="page"></main>
    </div>

    <!-- ลิ้นชักรายละเอียดผู้เล่น เลื่อนเข้ามาจากขวาตอนกดแถวในตาราง
         ใช้ลิ้นชักแทนหน้าใหม่ เพราะแอดมินมักต้องกลับไปดูตารางต่อทันที
         ถ้าเปลี่ยนหน้าจะเสียตำแหน่งที่เลื่อนกับคำค้นทุกครั้ง -->
    <aside class="drawer hidden" id="drawer">
      <div class="drawer-head">
        <b id="drawerTitle">ผู้เล่น</b>
        <button class="iconbtn" id="drawerClose" aria-label="ปิด">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
    <div class="scrim hidden" id="scrim"></div>

    <!-- แถบแจ้งผลมุมล่าง บอกว่าบันทึก/ลบสำเร็จหรือพัง -->
    <div class="toast hidden" id="toast" role="status"></div>

    <!-- ── กล่องยืนยันของหน้านี้เอง ────────────────────────────
         แทน confirm()/prompt() ของเบราว์เซอร์ ซึ่งมีปัญหาสามอย่างกับงานแบบนี้:
           1. หน้าตาเป็นของระบบปฏิบัติการ ไม่เข้ากับหน้าเว็บเลย
           2. จัดรูปแบบข้อความไม่ได้ ตัวเลขสำคัญกับคำเตือนเน้นไม่ได้
           3. บล็อกทั้งหน้าจนเบราว์เซอร์บางตัวขึ้นช่องให้ติ๊ก "ไม่ต้องแสดงอีก"
              ซึ่งถ้าผู้ใช้ติ๊ก การยืนยันจะหายไปเงียบ ๆ — อันตรายมากกับปุ่มลบ

         โครงเดียวใช้ได้ทั้งแบบกดยืนยันเฉย ๆ และแบบต้องพิมพ์ข้อความยืนยัน
         ช่องพิมพ์จะซ่อนไว้เมื่อไม่ได้ขอให้พิมพ์ -->
    <div class="modal hidden" id="modal">
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <b class="modal-title" id="modalTitle"></b>
        <div class="modal-body" id="modalBody"></div>
        <label class="modal-field hidden" id="modalField">
          <span id="modalLabel"></span>
          <input type="text" id="modalInput" autocomplete="off" spellcheck="false">
        </label>
        <div class="modal-actions">
          <button class="btn ghost" id="modalCancel">ยกเลิก</button>
          <button class="btn danger" id="modalOk">ยืนยัน</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/admin/main.js"></script>
</body>
</html>
