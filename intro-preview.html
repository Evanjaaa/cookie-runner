<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MeowZing — พรีวิวคลิปเปิดเกม (โค้ด)</title>
  <!-- หน้าพรีวิวตอนพัฒนาเท่านั้น: ไม่อยู่ใน rollupOptions.input ของ vite.config.js
       จึงไม่ถูก build และไม่ขึ้นเว็บจริง เปิดได้เฉพาะตอนรัน npm run dev -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .gate {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: rgba(0,0,0,.72); color: #FFF4DC; font: 600 22px Mitr, sans-serif;
      cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: center;
    }
    .gate small { display: block; margin-top: 8px; font: 400 14px Mitr, sans-serif; opacity: .7; }
    .gate[hidden] { display: none; }
    .time {
      position: fixed; left: 10px; bottom: 8px; color: rgba(255,244,220,.55);
      font: 400 12px Mitr, sans-serif; pointer-events: none;
    }
    /* ปุ่มคุมคลิป — มุมขวาล่าง ไม่ทับตัวนับเวลาที่อยู่มุมซ้าย
       โผล่เฉพาะตอนคลิปกำลังเล่น (ตอนมีฉากคลุมอยู่ก็ไม่มีอะไรให้หยุด) */
    .ctrl {
      position: fixed; right: 10px; bottom: 8px; display: flex; gap: 8px;
    }
    .ctrl[hidden] { display: none; }
    .ctrl button {
      padding: 7px 16px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(255,244,220,.32); background: rgba(24,10,38,.72);
      color: #FFF4DC; font: 600 14px Mitr, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="gate" id="gate">
    <div>▶ แตะเพื่อเล่น<small>หลับ → ท้องร้อง → ตื่น → หาว → ลูบท้อง → มองหา → กระโดดออก → แสงขาว</small></div>
  </div>
  <div class="time" id="time"></div>
  <!-- หยุด/เล่นต่อ: กดปุ่ม หรือเคาะ Space ก็ได้ (มือเดียวกับที่ถือเมาส์ดูอยู่) -->
  <div class="ctrl" id="ctrl" hidden>
    <button type="button" id="hold">⏸ หยุด</button>
  </div>

  <script type="module">
    import { playIntroAnim, INTRO_ANIM_LENGTH, prepareIntroSound } from './src/intro-anim.js';
    import { unlockAudio } from './src/audio.js';

    // โหลดไฟล์เสียงรอไว้ตั้งแต่เปิดหน้า เหมือนที่เกมจริงทำตอนเปิดเกม
    // ไม่งั้นครั้งแรกที่ยังไม่มีไฟล์ในแคช เพลงจะดังช้ากว่าภาพหลายวินาที
    prepareIntroSound();

    const cv = document.getElementById('cv');
    const gate = document.getElementById('gate');
    const time = document.getElementById('time');
    const ctrl = document.getElementById('ctrl');
    const hold = document.getElementById('hold');
    let started = 0;
    let play = null;      // ตัวคุมคลิปที่กำลังเล่นอยู่ (pause / resume / เรียกเพื่อหยุด)
    let heldAt = 0;       // เวลาที่กดหยุด — ไว้เลื่อนนาฬิกาบนจอให้ค้างตามคลิป

    function tick() {
      if (started) {
        // ตอนกดหยุด ตัวเลขต้องค้างด้วย ไม่งั้นมันจะเดินต่อทั้งที่ภาพนิ่ง แล้วอ่านผิดว่าเฟรมไหน
        const at = play?.paused ? heldAt : performance.now();
        const sec = Math.min((at - started) / 1000, INTRO_ANIM_LENGTH);
        time.textContent = sec.toFixed(1) + ' / ' + INTRO_ANIM_LENGTH.toFixed(1) + ' วิ'
          + (play?.paused ? ' · หยุดอยู่' : '');
      }
      requestAnimationFrame(tick);
    }
    tick();

    /** สลับหยุด/เล่นต่อ — ปุ่มบอกสิ่งที่จะเกิดขึ้นเมื่อกด ไม่ใช่สถานะปัจจุบัน */
    function toggleHold() {
      if (!play) return;
      if (play.paused) {
        started += performance.now() - heldAt;   // เวลาที่ค้างไว้ไม่นับเป็นเวลาในคลิป
        play.resume();
      } else {
        heldAt = performance.now();
        play.pause();
      }
      hold.textContent = play.paused ? '▶ เล่นต่อ' : '⏸ หยุด';
    }

    hold.addEventListener('click', toggleHold);
    // เคาะ Space ก็ได้ — ปุ่มมาตรฐานของการหยุดคลิปทุกที่
    addEventListener('keydown', (e) => {
      if (e.code !== 'Space' || !play) return;
      e.preventDefault();
      toggleHold();
    });

    gate.addEventListener('click', async () => {
      unlockAudio();   // ต้องเรียกตอนแตะจอ ไม่งั้นเบราว์เซอร์ปิดเสียง
      gate.hidden = true;
      // รอฟอนต์ก่อน ไม่งั้นตัวหนังสือ "โครก~" เฟรมแรกขึ้นเป็นฟอนต์ระบบแล้วค่อยกระโดดเปลี่ยน
      try { await document.fonts.load('600 40px Mitr'); } catch { /* ใช้ฟอนต์สำรอง */ }
      started = performance.now();
      hold.textContent = '⏸ หยุด';
      ctrl.hidden = false;
      play = playIntroAnim(cv, {
        onDone: () => {
          play = null;
          ctrl.hidden = true;
          gate.querySelector('div').innerHTML = '↻ เล่นอีกครั้ง<small>หลับ → ท้องร้อง → ตื่น → หาว → ลูบท้อง → มองหา → กระโดดออก → แสงขาว</small>';
          gate.hidden = false;
        },
      });
    });
  </script>
</body>
</html>
